version: '3.8'
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - mynet

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - mynet

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # UI quản trị
    networks:
      - mynet

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    env_file:
      - ./api-gateway/.env
    depends_on:
      - user-service
      - product-service
      - category-service
    networks:
      - mynet

  user-service:
    build:
      context: ./services/user-service
      target: prod
    ports:
      - "3001:3001"
    env_file:
      - ./services/user-service/.env
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - mynet

  product-service:
    build:
      context: ./services/product-service
      target: prod
    ports:
      - "3002:3002"
    env_file:
      - ./services/product-service/.env
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - mynet

  category-service:
    build:
      context: ./services/category-service
      target: prod
    ports:
      - "3003:3003"
    env_file:
      - ./services/category-service/.env
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - mynet

  notification-service:
    build:
      context: ./services/notification-service
      target: prod
    ports:
      - "3004:3004"
    env_file:
      - ./services/notification-service/.env
    depends_on:
      - redis
      - rabbitmq
    networks:
      - mynet

  inventory-service:
    build:
      context: ./services/inventory-service
      target: prod
    ports:
      - "3005:3005"
    env_file:
      - ./services/inventory-service/.env
    depends_on:
      - redis
      - rabbitmq
    networks:
      - mynet

  cart-service:
    build:
      context: ./services/cart-service
      target: prod
    ports:
      - "3006:3006"
    env_file:
      - ./services/cart-service/.env
    depends_on:
      - redis
      - rabbitmq
    networks:
      - mynet
networks:
  mynet:
    driver: bridge
